# Calino for Portainer (Stacks → Add stack → paste this, or point the stack at
# this file in the repository). Pulls a prebuilt image; nothing is built.
#
# Stack environment variables:
#   CALINO_CONFIG_FILE  (required) host path of the calino.config.json made by
#                       scripts/calino-config.mjs, e.g. /opt/calino/calino.config.json
#   CALINO_PORT         host port, default 8080
#   CALINO_IMAGE        default ghcr.io/chrisf4lc0n/calino:latest
#
# To change accounts or calendars: re-run the generator on the same file, then
# restart the stack (a page reload is enough, the file is read on each load).
services:
  calino:
    image: ${CALINO_IMAGE:-ghcr.io/chrisf4lc0n/calino:latest}
    ports:
      - "${CALINO_PORT:-8080}:8080"
    volumes:
      - ${CALINO_CONFIG_FILE:?Set CALINO_CONFIG_FILE to the host path of calino.config.json}:/calino/calino.config.json:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
