# Calino with a config made by scripts/calino-config.mjs mounted read-only.
# Pulls the prebuilt image; nothing is built here.
#
# Use it as /opt/calino/docker-compose.yml with an .env next to it, or in
# Portainer (Stacks → Add stack: paste it, or point the stack at this file in
# the repository). See docs/DEPLOY_WITH_GENERATED_CONFIG.md.
#
# Environment variables:
#   CALINO_CONFIG_FILE  (required) host path of calino.config.json,
#                       e.g. /opt/calino/calino.config.json
#   CALINO_IMAGE        default ghcr.io/chrisf4lc0n/calino:latest; a sha-… tag
#                       pins one build, calino:local uses one you built
#   CALINO_PORT         host port, default 8080
#
# To change accounts or calendars: re-run the generator on the same file and
# reload the page. The file is read on every load; no restart is needed.
services:
  calino:
    image: ${CALINO_IMAGE:-ghcr.io/chrisf4lc0n/calino:latest}
    ports:
      - "${CALINO_PORT:-8080}:8080"
    volumes:
      - ${CALINO_CONFIG_FILE:?Set CALINO_CONFIG_FILE to the host path of calino.config.json}:/calino/calino.config.json:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
