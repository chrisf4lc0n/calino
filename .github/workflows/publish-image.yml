# Publishes ghcr.io/<owner>/calino:latest on every push to main, so a server
# (e.g. a Portainer stack) can pull a ready image instead of building one.
# The image reads its accounts from a mounted calino.config.json at runtime;
# see docs/PORTAINER.md.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/calino
          tags: |
            type=raw,value=latest
            type=sha

      # The bundle is built once on the runner's platform (see the Dockerfile's
      # --platform=$BUILDPLATFORM); the arm64 variant only copies files, so no
      # emulation is needed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
